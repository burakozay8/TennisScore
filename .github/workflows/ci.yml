name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    name: ScoringEngine tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Swift version
        run: swift --version
      - name: Run engine tests
        run: swift test --package-path Packages/ScoringEngine

  app-tests:
    name: iOS app tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Build and test app
        run: >
          xcodebuild test
          -project TennisScore.xcodeproj
          -scheme TennisScore
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2'
          CODE_SIGNING_ALLOWED=NO
